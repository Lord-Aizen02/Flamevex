<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flamevex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17132b; --panel: #221c3d; --paper: #f3efff; --muted: #a79fc9;
    --yt: #ff4545; --dc: #7c6cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font-family: "Bricolage Grotesque", system-ui, sans-serif; line-height: 1.55;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 20px 40px; }
  h1 { font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.02; margin: 0 0 16px; font-weight: 800; letter-spacing: -0.02em; }
  .lead { color: var(--muted); max-width: 52ch; font-size: 1.15rem; margin: 0 0 28px; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 40px; }
  .hero { margin-bottom: 40px; }
  .featured { position: relative; display: block; border-radius: 16px; overflow: hidden; border: 3px solid var(--yt); aspect-ratio: 16/9; background: #000; }
  .featured img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .featured:hover img { transform: scale(1.03); }
  .play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; background: var(--yt); border-radius: 50%; }
  .play::after { content: ""; position: absolute; left: 25px; top: 19px; border-left: 20px solid #fff; border-top: 13px solid transparent; border-bottom: 13px solid transparent; }
  .tag { position: absolute; left: 12px; top: 12px; background: var(--yt); color: #fff; font-weight: 600; font-size: .85rem; padding: 4px 12px; border-radius: 999px; }
  .btn {
    padding: 13px 22px; border-radius: 999px; color: #fff; text-decoration: none;
    font-weight: 600; border: 2px solid transparent;
  }
  .btn.yt { background: var(--yt); }
  .btn.dc { background: var(--dc); }
  .btn:hover { filter: brightness(1.1); }
  :focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start; }
  section { background: var(--panel); border-radius: 18px; padding: 20px; }
  section.yt { border-top: 4px solid var(--yt); }
  section.dc { border-top: 4px solid var(--dc); }
  h2 { margin: 0 0 14px; font-size: 1.3rem; }
  .frame { position: relative; padding-top: 56.25%; border-radius: 10px; overflow: hidden; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .widget { width: 100%; height: 420px; border: 0; border-radius: 10px; }
  .poster { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #000; cursor: pointer; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  footer { margin-top: 40px; color: var(--muted); font-size: .9rem; }
  @media (max-width: 760px) { .grid, .hero { grid-template-columns: 1fr; } }
</style>
</head>

  // Thumbnail shows first; click loads the player (uploads playlist = channel ID with "UC" swapped for "UU")
  document.getElementById("yt-play").addEventListener("click", function () {
    const f = document.createElement("iframe");
    f.title = "Latest YouTube uploads";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    f.src = "https://www.youtube.com/embed/videoseries?list=" + YOUTUBE_CHANNEL_ID.replace(/^UC/, "UU") + "&autoplay=1";
    document.getElementById("yt-frame").replaceChildren(f);
  });
  const widget = document.getElementById("dc-widget");
  if (/^0+$/.test(DISCORD_SERVER_ID)) {
    // No server ID yet: show a join card instead of the live widget
    const card = document.createElement("p");
    card.innerHTML = 'Join the community to chat about new edits.<br><br><a class="btn dc" href="' + DISCORD_INVITE + '">Join the Discord</a>';
    widget.replaceWith(card);
  } else {
    widget.src = "https://discord.com/widget?id=" + DISCORD_SERVER_ID + "&theme=dark";
  }
</script>
</body>
</html>
